name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Unit tests never connect to Postgres, but importing the Drizzle module fails
    # fast without these (src/server/db/drizzle.ts). .env.test is git-ignored, so
    # set them here. DB_NAME matches the integration-test safety guard.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ci-unused
      DB_NAME: inventory_test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Unit and component tests
        run: npm run test:unit

  # Integration tests (npm run test:integration) are not run yet: they need a
  # Postgres whose schema can be rebuilt from the repo, which depends on adding
  # migrations (issue #5). Add a job with a postgres service container then.
